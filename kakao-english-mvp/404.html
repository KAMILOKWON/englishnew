<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <title>페이지를 찾을 수 없습니다 | 데일리톡잉글리시</title>
    <style>
      :root {
        color-scheme: light;
        --mint: #12876f;
        --ink: #17212b;
        --muted: #5d6b78;
        --bg: #f8faf9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--mint);
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 56px;
        line-height: 1;
        color: var(--mint);
      }
      h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }
      a.home {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      a.home:hover {
        background: #000;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">DAILY TALK ENGLISH</span>
      <h1>404</h1>
      <h2>페이지를 찾을 수 없습니다</h2>
      <p>
        요청하신 페이지가 없거나 주소가 변경되었습니다.<br />
        매일 아침 카톡으로 받는 1분 영어, 홈에서 다시 시작해 보세요.
      </p>
      <a class="home" href="./">홈으로 돌아가기</a>
    </main>
  </body>
</html>
